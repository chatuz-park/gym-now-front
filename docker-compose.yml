version: "3.9"

services:
  web-dev:
    build:
      context: .
      target: dev
    container_name: gym-now-web-dev
    ports:
      - "${PORT:-5173}:${PORT:-5173}"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
      - HOST=0.0.0.0
      - PORT=${PORT:-5173}
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "-c", "npm run dev -- --host 0.0.0.0 --port ${PORT:-5173}"]
    profiles: ["dev"]

  web:
    build:
      context: .
      target: prod
    container_name: gym-now-web
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://backend:8000/api}
    profiles: ["prod"]
