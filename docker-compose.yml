name: gym-now

services:
  web:
    build:
      context: .
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-Gym Now}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
    pull_policy: build
    ports:
      - "${HTTP_PORT:-8080}:80"
    restart: unless-stopped

  web-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    pull_policy: build
    ports:
      - "${PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
