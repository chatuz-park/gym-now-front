version: "3.9"

services:
  web-dev:
    build:
      context: .
      target: dev
    container_name: gym-now-web-dev
    restart: unless-stopped
    ports:
      - "${PORT:-5173}:${PORT:-5173}"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
      - HOST=0.0.0.0
      - PORT=${PORT:-5173}
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "-c", "bun run dev -- --host 0.0.0.0 --port ${PORT:-5173}"]
    profiles: ["dev"]

  web:
    build:
      context: .
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-Gym Now}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
    container_name: gym-now-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    profiles: ["prod"]
